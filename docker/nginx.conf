server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed bundles never change: cache them for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Single-page app: unknown paths (e.g. /#token=... callbacks) go to index.html,
    # which is never cached so a new deploy is picked up straight away.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
